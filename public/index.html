<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yachat</title>
<style>
:root{--bg:#f3f5ee;--surface:#fff;--line:#d3dac4;--fg:#1f2b17;--muted:#5b6850;--green:#2f4d1f;--on-green:#fff;--user:#2f4d1f;--yellow:#fff2c4;--pink:#e0489a}
@media (prefers-color-scheme:dark){:root{--bg:#121a0e;--surface:#1b2615;--line:#34452c;--fg:#eaf0df;--muted:#9fb08f;--green:#9ccf72;--on-green:#10200a;--user:#9ccf72;--yellow:#3a3315;--pink:#f070b4}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
header{padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
header h1{margin:0;font-size:20px;color:var(--green)}
header p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.demo{background:var(--yellow);font-size:12px;padding:6px 16px}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;padding:10px 12px;border-radius:14px;white-space:normal;overflow-wrap:anywhere}
.m.bot{background:var(--surface);border:1px solid var(--line);align-self:flex-start}
.m.me{background:var(--user);color:var(--on-green);align-self:flex-end}
.m.err{background:var(--yellow);align-self:flex-start}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 8px}
.chips button{font:inherit;font-size:14px;padding:8px 12px;border-radius:99px;border:1px solid var(--green);background:var(--surface);color:var(--fg);cursor:pointer}
form{display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
input{flex:1;min-width:0;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
form button{font:inherit;font-weight:600;padding:0 16px;border-radius:10px;border:0;background:var(--green);color:var(--on-green);cursor:pointer}
button:disabled{opacity:.5}
button:focus-visible,input:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
</style>
</head>
<body>
<header>
  <h1>Yachat</h1>
  <p>Tu tutor para ingresar a San Marcos · Área Ingeniería</p>
</header>
<div class="demo">Demo · prototipo sin revisión docente. No compartas datos personales.</div>
<div id="log" aria-live="polite"></div>
<div class="chips" id="chips">
  <button type="button" data-t="Quiero hacer el diagnóstico de mi nivel.">Diagnóstico</button>
  <button type="button" data-t="Arma mi plan de estudio semanal para Ingeniería.">Mi plan de estudio</button>
  <button type="button" data-t="Dame un ejercicio de Física tipo examen.">Practicar Física</button>
  <button type="button" data-t="Dame un ejercicio de Matemática tipo examen.">Practicar Matemática</button>
</div>
<form id="f">
  <input id="in" autocomplete="off" maxlength="1500" placeholder="Escribe tu respuesta o tu duda" aria-label="Mensaje">
  <button id="send">Enviar</button>
</form>
<script>
var log=document.getElementById('log'),input=document.getElementById('in'),send=document.getElementById('send');
var history=[];
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fmt(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')}
function add(cls,html){var d=document.createElement('div');d.className='m '+cls;d.innerHTML=html;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
add('bot','¡Hola! Soy Yachat. Te ayudo a prepararte para el examen de San Marcos, sin academia. Elige una opción de abajo o escríbeme tu duda.');
async function ask(text){
  if(!text.trim())return;
  add('me',esc(text));history.push({role:'user',content:text});
  input.value='';send.disabled=true;
  var wait=add('bot','Pensando…');
  try{
    var r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({messages:history})});
    var j=await r.json();
    wait.remove();
    if(!r.ok){history.pop();add('err',esc(j.error||'No se pudo responder.'));}
    else{history.push({role:'assistant',content:j.reply});add('bot',fmt(j.reply));}
  }catch(e){wait.remove();history.pop();add('err','Sin conexión. Revisa tu internet e intenta otra vez.')}
  send.disabled=false;input.focus();
}
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();ask(input.value)});
document.getElementById('chips').addEventListener('click',function(e){var b=e.target.closest('button');if(b&&!send.disabled)ask(b.dataset.t)});
</script>
</body>
</html>
